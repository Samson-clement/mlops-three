name: Test JDK Download

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  download-jdk:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download JDK 11.0.27+6
      shell: pwsh
      run: |
        # Create a directory for the JDK file
        New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/jdk" -Force
        # Download the JDK file from Eclipse Temurin
        Invoke-WebRequest -Uri "https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.27%2B6/OpenJDK11U-jdk_x64_windows_hotspot_11.0.27_6.zip" -OutFile "$env:GITHUB_WORKSPACE/jdk/jdk-11.0.9_windows-x64_bin.zip"

    - name: Verify JDK File
      shell: pwsh
      run: |
        # List the file to confirm it exists
        Get-ChildItem -Path "$env:GITHUB_WORKSPACE/jdk"
